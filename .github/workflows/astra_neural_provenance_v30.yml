name: TREBLO Astra v3.0 neural input provenance tests
on:
  pull_request:
    paths:
      - 'tools/mastering/neural_provenance_gate.py'
      - 'tools/mastering/neural_master_v30.py'
      - 'tools/mastering/NEURAL_PROVENANCE_V3_RU.md'
      - 'tests/test_neural_provenance_gate.py'
      - 'tests/test_neural_master_v30.py'
      - '.github/workflows/astra_neural_provenance_v30.yml'
  workflow_dispatch:
jobs:
  cpu-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12'
      - run: PYTHONPATH=tools/mastering python -m unittest discover -s tests -p 'test_neural_provenance_gate.py' -v
      - run: PYTHONPATH=tools/mastering python -m unittest discover -s tests -p 'test_neural_master_v30.py' -v
