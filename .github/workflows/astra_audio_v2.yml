name: Astra Pedalboard + Stem QC
on:
  pull_request:
    paths:
      - 'tools/mastering/astra_pedalboard.py'
      - 'tools/mastering/msst_bridge.py'
      - 'tools/mastering/stem_delta_rework.py'
      - 'tools/mastering/make_ab.py'
      - 'tests/test_*.py'
      - '.github/workflows/astra_audio_v2.yml'
  workflow_dispatch:
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip && pip install 'pedalboard>=0.9,<1' 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'soundfile>=0.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v