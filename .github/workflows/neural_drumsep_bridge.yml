name: Neural DrumSep bridge (mock-source safety tests)
on:
  pull_request:
    paths:
      - 'tools/mastering/neural_drumsep_bridge.py'
      - 'tests/test_neural_drumsep_bridge.py'
      - '.github/workflows/neural_drumsep_bridge.yml'
  workflow_dispatch:
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'soundfile>=0.12,<1'
      - run: python -m unittest discover -s tests -p 'test_neural_drumsep_bridge.py' -v