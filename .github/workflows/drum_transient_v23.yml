name: TREBLO Astra v2.3 transient DSP tests
on:
  pull_request:
    paths:
      - 'tools/mastering/**'
      - 'tests/**'
      - '.github/workflows/drum_transient_v23.yml'
  workflow_dispatch:
jobs:
  cpu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'soundfile>=0.12' 'pedalboard>=0.9,<1'
      - run: PYTHONPATH=tools/mastering python -m unittest discover -s tests -p 'test_*.py' -v
