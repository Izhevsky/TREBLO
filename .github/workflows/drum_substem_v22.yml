name: drum-substem-dsp-v22-tests
on:
  pull_request:
    paths:
      - 'tools/mastering/drum_substem_dsp.py'
      - 'tools/mastering/render_v22.py'
      - 'tests/test_drum_substem_dsp.py'
      - '.github/workflows/drum_substem_v22.yml'
  workflow_dispatch:

jobs:
  cpu-dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - run: python -m unittest discover -s tests -p 'test_drum_substem_dsp.py' -v