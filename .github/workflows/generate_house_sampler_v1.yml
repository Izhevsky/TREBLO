name: Generate House Sampler v1

on:
  push:
    branches: [house-sampler-v1]
    paths:
      - 'tools/generate_house_sampler_v1.py'
      - '.github/workflows/generate_house_sampler_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: house-sampler-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DSP dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Generate original 4-bar sampler loops
        run: python tools/generate_house_sampler_v1.py
      - name: Validate WAV files
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for f in loops/house_sampler_v1/*.wav; do
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done
      - name: Commit generated loops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add loops/house_sampler_v1
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Generate original House Sampler v1 loops'
          git push origin HEAD:house-sampler-v1
