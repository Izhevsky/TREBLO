name: TREBLO Astra v2.8 neural master gated E2E (synthetic fixtures)
on:
  pull_request:
    paths:
      - 'tools/mastering/neural_master_pipeline.py'
      - 'tools/mastering/neural_kick_guard.py'
      - 'tests/test_neural_master_pipeline.py'
      - '.github/workflows/neural_master_v28.yml'
  workflow_dispatch:
jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'soundfile>=0.12' 'pedalboard>=0.9,<1'
      - name: Run full synthetic audio-to-FLAC tests; NO neural checkpoint or user audio
        run: PYTHONPATH=tools/mastering python -m unittest discover -s tests -p 'test_neural_master_pipeline.py' -v