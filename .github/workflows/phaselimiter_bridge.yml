name: phaselimiter-bridge-tests
on:
  pull_request:
    paths:
      - "tools/mastering/**"
      - "tests/test_phaselimiter_bridge.py"
      - ".github/workflows/phaselimiter_bridge.yml"
  workflow_dispatch:

jobs:
  wrapper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -p 'test_phaselimiter_bridge.py' -v
