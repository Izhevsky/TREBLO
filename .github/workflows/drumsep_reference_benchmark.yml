name: DrumSep v2.7 real checkpoint reference benchmark
on:
  pull_request:
    paths:
      - 'tools/mastering/drumsep_reference_benchmark.py'
      - 'tests/test_drumsep_reference_benchmark.py'
      - 'tools/mastering/neural_kick_guard.py'
      - 'tests/test_neural_kick_guard.py'
      - '.github/workflows/drumsep_reference_benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model-reference-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: tools/mastering
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested CPU runtime and pinned MDX23C library
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'mdxnet-infer @ git+https://github.com/openmirlab/mdxnet-infer.git@cb4779eedeca4f55ba498df8e234e2b5f4b90aaf'
          python -m pip install --disable-pip-version-check scipy numpy soundfile
      - name: Unit tests (do not download checkpoint)
        run: python -m unittest discover -s tests -p 'test_drumsep_reference_benchmark.py' -v
      - name: Real DrumSep vs known ORIGINAL kick/snare/toms/hat/ride/crash synthetic references
        run: |
          python tools/mastering/drumsep_reference_benchmark.py \
            --seconds 7.0 --device cpu --cache-dir /tmp/treblo-drumsep-weights \
            --allow-download --output /tmp/drumsep-reference-benchmark-v27.json
      - name: Upload measured scores only, no weights and no audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drumsep-v27-synthetic-reference-qc
          path: /tmp/drumsep-reference-benchmark-v27.json
          retention-days: 7
      - name: Offline kick-only safety-gate tests
        run: python -m unittest discover -s tests -p 'test_neural_kick_guard.py' -v